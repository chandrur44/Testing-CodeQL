name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  trivy-secrets:
    name: Trivy (Secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Trivy secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: sarif
          output: trivy-secrets.sarif
          exit-code: 0

      - name: Label SARIF tool as "Trivy Secret Scanner"
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("trivy-secrets.sarif")
          d = json.loads(p.read_text())
          for run in d.get("runs", []):
            run.setdefault("tool", {}).setdefault("driver", {})["name"] = "Trivy Secret Scanner"
          p.write_text(json.dumps(d))
          PY

      - name: Upload Secrets SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-secrets.sarif
          category: trivy-secrets

      - name: Upload Secrets SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-secrets-sarif
          path: trivy-secrets.sarif

  trivy-dockerfile:
    name: Trivy (Dockerfile misconfig)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Trivy config scan on Dockerfiles
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-dockerfile.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: 0

      - name: Label SARIF tool as "Trivy Dockerfile Scanner"
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("trivy-dockerfile.sarif")
          d = json.loads(p.read_text())
          for run in d.get("runs", []):
            run.setdefault("tool", {}).setdefault("driver", {})["name"] = "Trivy Dockerfile Scanner"
          p.write_text(json.dumps(d))
          PY

      - name: Upload Dockerfile SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-dockerfile.sarif
          category: trivy-dockerfile

      - name: Upload Dockerfile SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-dockerfile-sarif
          path: trivy-dockerfile.sarif

  trivy-image:
    name: Trivy (Docker image vulnerabilities)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build local image
        run: docker build -t local/testing-codeql:ci .

      - name: Build bait image
        run: docker build -t local/testing-codeql-bait:ci -f bait/image.Dockerfile bait/

      - name: Run Trivy image scan (real image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: local/testing-codeql:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: 0

      - name: Run Trivy image scan (bait image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: local/testing-codeql-bait:ci
          format: sarif
          output: trivy-image-bait.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: 0

      - name: Merge image SARIF reports and label tool
        run: |
          python - <<'PY'
          import json, pathlib
          real = json.loads(pathlib.Path("trivy-image.sarif").read_text())
          bait = json.loads(pathlib.Path("trivy-image-bait.sarif").read_text())
          real["runs"].extend(bait.get("runs", []))
          for run in real.get("runs", []):
            run.setdefault("tool", {}).setdefault("driver", {})["name"] = "Trivy Image Scanner"
          pathlib.Path("trivy-image.sarif").write_text(json.dumps(real))
          PY

      - name: Upload image SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Upload image SARIF as artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
